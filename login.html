<!DOCTYPE html>
<html lang="en">
<head>
    <title>SoundScape - Login</title>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>🎵 SoundScape</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="playlists.html">Playlists</a>
        <a href="artists.html">Artists</a>
        <a href="stats.html">Stats</a>
        <a href="login.html">Login</a>
    </nav>
</header>
<section>
    <h2 style="text-align:center;">Login to SoundScape</h2>
    <form class="formbox" action="index.html" method="get">

        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" minlength="6" required>

        <label for="age">Age</label>
        <input type="number" id="age" name="age" min="10" max="100" required>

        <label>Gender</label>
        <div class="options">
            <label><input type="radio" name="gender" value="Female" required> Female</label>
            <label><input type="radio" name="gender" value="Male"> Male</label>
            <label><input type="radio" name="gender" value="Other"> Other</label>
            <label><input type="radio" name="gender" value="Prefer not to say"> Prefer not to say</label>
        </div>

        <label for="music">Type of music you listen to most</label>
        <select id="music" name="music" required>
            <option value="">-- Choose one --</option>
            <option>Pop</option>
            <option>Rock</option>
            <option>Indie</option>
            <option>Bollywood</option>
            <option>Hip-hop</option>
            <option>Classical</option>
            <option>Lo-fi</option>
        </select>

        <button type="submit" class="submit">Login</button>
    </form>
</section>
<footer>
    <p>© 2026 SoundScape | Made with Music ❤️</p>
</footer>
</body>
</html>
